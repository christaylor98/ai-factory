[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-factory"
version = "1.2.0"
description = "AI Factory - Minimal LLM execution library: single prompts and streamed agent runs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "AI Factory Team"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# The core needs no provider SDK: stub, claude_code, ollama and copilot_cli are stdlib-only. Each SDK-backed
# provider is an extra; without its SDK it stays listed and a run on it fails with an "install ..." error.
dependencies = [
    "python-dotenv>=0.19.0",
    "tomli>=1.2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.1.0"]
openai = ["openai>=1.0.0"]
openrouter = ["openai>=1.0.0"]
local = ["openai>=1.0.0"]          # OpenAI-compatible local servers (llama-server, vLLM)
anthropic = ["anthropic>=0.18.0"]
all = ["google-genai>=0.1.0", "openai>=1.0.0", "anthropic>=0.18.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
mcp = [
    "mcp>=1.2.0,<2",
]

[project.scripts]
ai-factory = "ai_factory.cli:main"
ai-factory-mcp = "ai_factory.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # the checkout under test, not whatever copy is pip-installed
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
